// ---------- Data hook (Supabase) ----------
function useTable(table, orderBy) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');

  const reload = useCallback(async () => {
    setLoading(true);
    const { data, error } = await supabase.from(table).select('*').order(orderBy || 'id', { ascending: false });
    if (error) setErr(error.message); else { setRows(data || []); setErr(''); }
    setLoading(false);
  }, [table, orderBy]);

  useEffect(() => { reload(); }, [reload]);

  const insert = async (row) => { const { error } = await supabase.from(table).insert(row); if (error) throw error; await reload(); };
  const update = async (id, row) => { const { error } = await supabase.from(table).update(row).eq('id', id); if (error) throw error; await reload(); };
  const remove = async (id) => { const { error } = await supabase.from(table).delete().eq('id', id); if (error) throw error; await reload(); };

  return { rows, loading, err, reload, insert, update, remove };
}

// ---------- Dashboard ----------
function computeMonthlyTotals(financeiro) {
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.toISOString().slice(0, 7);
    const label = d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
    months.push({ key, label, receita: 0, despesa: 0 });
  }
  financeiro.forEach((t) => {
    const key = (t.data || '').slice(0, 7);
    const m = months.find((mm) => mm.key === key);
    if (m) { if (t.tipo === 'entrada') m.receita += Number(t.valor) || 0; else m.despesa += Number(t.valor) || 0; }
  });
  return months;
}
function MiniBarChart({ data }) {
  const max = Math.max(1, ...data.flatMap((d) => [d.receita, d.despesa]));
  return (
    <div className="flex items-end gap-3" style={{ height: 180 }}>
      {data.map((d) => (
        <div key={d.key} className="flex-1 flex flex-col items-center gap-1">
          <div className="w-full flex items-end gap-1" style={{ height: 150 }}>
            <div style={{ flex: 1, height: `${(d.receita / max) * 100}%`, backgroundColor: COLORS.success, borderRadius: '2px 2px 0 0', minHeight: d.receita ? 2 : 0 }} title={fmtMoney(d.receita)} />
            <div style={{ flex: 1, height: `${(d.despesa / max) * 100}%`, backgroundColor: COLORS.danger, borderRadius: '2px 2px 0 0', minHeight: d.despesa ? 2 : 0 }} title={fmtMoney(d.despesa)} />
          </div>
          <span className="text-xs capitalize" style={{ color: COLORS.textSecondary }}>{d.label}</span>
        </div>
      ))}
    </div>
  );
}
function Dashboard({ clientes, ordens, estoque, financeiro, isDono, onNavigate }) {

  const receitaMes = financeiro.filter((t) => t.tipo === 'entrada' && (t.data || '').startsWith(thisMonth)).reduce((s, t) => s + Number(t.valor || 0), 0);
  const despesaMes = financeiro.filter((t) => t.tipo === 'saida' && (t.data || '').startsWith(thisMonth)).reduce((s, t) => s + Number(t.valor || 0), 0);
  const chartData = useMemo(() => computeMonthlyTotals(financeiro), [financeiro]);
  const recentOrders = [...ordens].sort((a, b) => (b.data_entrada || '').localeCompare(a.data_entrada || '')).slice(0, 5);

  const cards = [

  if (isDono) cards.push({ label: 'Saldo do mês', value: fmtMoney(receitaMes - despesaMes), icon: 'wallet', color: COLORS.info, onClick: () => onNavigate('financeiro') });

}

  const [deleting, setDeleting] = useState(null);
  const [formErr, setFormErr] = useState('');

  const filtered = table.rows.filter((c) => c.nome.toLowerCase().includes(search.toLowerCase()) || (c.telefone || '').includes(search)).sort((a, b) => a.nome.localeCompare(b.nome));

  const save = async (data) => {
    try {
      const { id, ...rest } = data;
      if (id) await table.update(id, rest); else await table.insert(rest);
      setEditing(null); setFormErr('');
    } catch (e) { setFormErr(e.message); }
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h1 className="text-xl font-semibold" style={{ color: COLORS.textPrimary }}>Clientes</h1>
        <Button onClick={() => setEditing({})}><Icon name="plus" size={16} /> Novo cliente</Button>
      </div>
      <ErrorBanner message={table.err} />
      <div className="relative mb-4 max-w-sm">
        <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2" color={COLORS.textMuted} />
        <Input placeholder="Buscar por nome ou telefone" value={search} onChange={(e) => setSearch(e.target.value)} style={{ paddingLeft: 32 }} />
      </div>
      {filtered.length === 0 ? <EmptyState icon="users" title="Nenhum cliente encontrado" subtitle="Cadastre o primeiro cliente da loja." /> : (
        <div className="rounded overflow-hidden" style={{ border: `1px solid ${COLORS.border}` }}>
          {filtered.map((c) => (
            <div key={c.id} className="flex items-center justify-between px-4 py-3 gap-3" style={{ backgroundColor: COLORS.surface, borderBottom: `1px solid ${COLORS.border}` }}>
              <div className="min-w-0"><p className="text-sm font-medium truncate" style={{ color: COLORS.textPrimary }}>{c.nome}</p><p className="text-xs truncate" style={{ color: COLORS.textMuted }}>{c.telefone}{c.email ? ` · ${c.email}` : ''}</p></div>
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={() => setEditing(c)} className="p-2 rounded hover:opacity-70"><Icon name="edit" size={15} color={COLORS.textSecondary} /></button>
                <button onClick={() => setDeleting(c)} className="p-2 rounded hover:opacity-70"><Icon name="trash" size={15} color={COLORS.danger} /></button>
              </div>
            </div>
          ))}
        </div>
      )}
      {editing !== null && <ClienteForm cliente={editing} error={formErr} onClose={() => { setEditing(null); setFormErr(''); }} onSave={save} />}
      {deleting && <ConfirmModal message={`Excluir o cliente "${deleting.nome}"? As ordens de serviço vinculadas a ele não serão apagadas.`} onCancel={() => setDeleting(null)} onConfirm={async () => { await table.remove(deleting.id); setDeleting(null); }} />}
    </div>
  );
}
function ClienteForm({ cliente, error, onClose, onSave }) {
  const [form, setForm] = useState({ id: cliente.id, nome: cliente.nome || '', telefone: cliente.telefone || '', email: cliente.email || '', endereco: cliente.endereco || '' });
  const submit = (e) => { e.preventDefault(); if (!form.nome.trim()) return; onSave(form); };
  return (
    <Modal title={cliente.id ? 'Editar cliente' : 'Novo cliente'} onClose={onClose}>
      <form onSubmit={submit}>
        <Field label="Nome" required><Input value={form.nome} onChange={(e) => setForm({ ...form, nome: e.target.value })} required autoFocus /></Field>
        <Field label="Telefone"><Input value={form.telefone} onChange={(e) => setForm({ ...form, telefone: e.target.value })} placeholder="(21) 90000-0000" /></Field>
        <Field label="E-mail"><Input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></Field>
        <Field label="Endereço"><Input value={form.endereco} onChange={(e) => setForm({ ...form, endereco: e.target.value })} /></Field>
        {error && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{error}</p>}
        <div className="flex justify-end gap-2 mt-4"><Button variant="secondary" type="button" onClick={onClose}>Cancelar</Button><Button type="submit">Salvar</Button></div>
      </form>
    </Modal>
  );
}

// ---------- Ordens ----------
function OrdensView({ table, clientesRows, config, onLancarFinanceiro }) {
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('Todos');
  const [editing, setEditing] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const [printing, setPrinting] = useState(null);
  const [entregando, setEntregando] = useState(null);
  const [formErr, setFormErr] = useState('');

  const clienteNome = (id) => clientesRows.find((c) => c.id === id)?.nome || 'Cliente removido';
  const filtered = table.rows.filter((o) => {
    const matchesStatus = statusFilter === 'Todos' || o.status === statusFilter;
    const matchesSearch = !search || o.aparelho.toLowerCase().includes(search.toLowerCase()) || clienteNome(o.cliente_id).toLowerCase().includes(search.toLowerCase());
    return matchesStatus && matchesSearch;
  }).sort((a, b) => (b.data_entrada || '').localeCompare(a.data_entrada || ''));

  const save = async (data) => {
    try {
      const { id, ...rest } = data;
      rest.valor_orcamento = toNum(rest.valor_orcamento);
      rest.valor_final = toNum(rest.valor_final);
      if (id) await table.update(id, rest); else await table.insert(rest);
      setEditing(null); setFormErr('');
    } catch (e) { setFormErr(e.message); }
  };

  const confirmarEntrega = async (ordem, { valor, descricao }) => {
    await onLancarFinanceiro({ tipo: 'entrada', descricao, valor: toNum(valor), categoria: 'Serviço', data: todayISO() });
    await table.update(ordem.id, { status: 'Entregue', valor_final: toNum(valor) });
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h1 className="text-xl font-semibold" style={{ color: COLORS.textPrimary }}>Ordens de serviço</h1>
        <Button onClick={() => setEditing({})}><Icon name="plus" size={16} /> Nova ordem</Button>
      </div>
      <ErrorBanner message={table.err} />
      <div className="flex flex-wrap gap-3 mb-4">
        <div className="relative flex-1 min-w-[200px] max-w-sm">
          <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2" color={COLORS.textMuted} />
          <Input placeholder="Buscar por aparelho ou cliente" value={search} onChange={(e) => setSearch(e.target.value)} style={{ paddingLeft: 32 }} />
        </div>
        <Select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} style={{ width: 'auto' }}>
          <option value="Todos">Todos os status</option>
          {STATUS_ORDER.map((s) => <option key={s} value={s}>{s}</option>)}
        </Select>
      </div>
      {filtered.length === 0 ? <EmptyState icon="wrench" title="Nenhuma ordem encontrada" subtitle="Crie uma ordem de serviço para começar a acompanhar um reparo." /> : (
        <div className="space-y-2">
          {filtered.map((o) => (
            <div key={o.id} className="p-4 rounded flex flex-col sm:flex-row sm:items-center justify-between gap-3" style={{ backgroundColor: COLORS.surface, border: `1px solid ${COLORS.border}` }}>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2 flex-wrap"><p className="text-sm font-medium" style={{ color: COLORS.textPrimary }}>{o.aparelho}</p><StatusBadge status={o.status} /></div>
                <p className="text-xs mt-1" style={{ color: COLORS.textMuted }}>{clienteNome(o.cliente_id)} · entrada {fmtDate(o.data_entrada)}{o.fotos && o.fotos.length > 0 ? ` · 📷 ${o.fotos.length}` : ''}</p>
                <p className="text-xs mt-0.5 truncate max-w-md" style={{ color: COLORS.textSecondary }}>{o.problema}</p>
              </div>
              <div className="flex items-center gap-3 shrink-0">
                <p className="text-sm font-medium" style={{ fontFamily: "'JetBrains Mono', monospace", color: COLORS.textPrimary }}>{fmtMoney(o.valor_final || o.valor_orcamento || 0)}</p>
                {!['Entregue', 'Cancelado'].includes(o.status) && (
                  <button onClick={() => setEntregando(o)} className="p-2 rounded hover:opacity-70" title="Entregar e lançar no caixa"><Icon name="check" size={15} color={COLORS.success} /></button>
                )}
                <button onClick={() => setPrinting(o)} className="p-2 rounded hover:opacity-70" title="Emitir recibo"><Icon name="printer" size={15} color={COLORS.textSecondary} /></button>
                <button onClick={() => setEditing(o)} className="p-2 rounded hover:opacity-70"><Icon name="edit" size={15} color={COLORS.textSecondary} /></button>
                <button onClick={() => setDeleting(o)} className="p-2 rounded hover:opacity-70"><Icon name="trash" size={15} color={COLORS.danger} /></button>
              </div>
            </div>
          ))}
        </div>
      )}
      {editing !== null && <OrdemForm ordem={editing} clientes={clientesRows} error={formErr} onClose={() => { setEditing(null); setFormErr(''); }} onSave={save} />}
      {deleting && <ConfirmModal message={`Excluir a ordem de serviço de "${deleting.aparelho}"?`} onCancel={() => setDeleting(null)} onConfirm={async () => { await table.remove(deleting.id); setDeleting(null); }} />}
      {printing && <ReciboModal ordem={printing} cliente={clientesRows.find((c) => c.id === printing.cliente_id)} config={config} onClose={() => setPrinting(null)} />}
      {entregando && <EntregaModal ordem={entregando} cliente={clientesRows.find((c) => c.id === entregando.cliente_id)} onClose={() => setEntregando(null)} onConfirm={(data) => confirmarEntrega(entregando, data)} />}
    </div>
  );
}
function EntregaModal({ ordem, cliente, onClose, onConfirm }) {
  const [valor, setValor] = useState(ordem.valor_final || ordem.valor_orcamento || '');
  const [descricao, setDescricao] = useState(`Entrega OS #${ordem.numero} — ${ordem.aparelho}`);
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setSaving(true); setError('');
    try { await onConfirm({ valor, descricao }); onClose(); }
    catch (err) { setError(err.message); setSaving(false); }
  };

  return (
    <Modal title={`Entregar — Ordem #${ordem.numero}`} onClose={onClose}>
      <p className="text-xs mb-3" style={{ color: COLORS.textMuted }}>Isso marca a ordem como "Entregue" e lança uma entrada no caixa (Financeiro).</p>
      <p className="text-sm mb-3" style={{ color: COLORS.textPrimary }}>Cliente: <strong>{cliente?.nome || '—'}</strong></p>
      <form onSubmit={submit}>
        <Field label="Descrição do lançamento" required><Input value={descricao} onChange={(e) => setDescricao(e.target.value)} required /></Field>
        <Field label="Valor recebido (R$)" required><Input type="number" step="0.01" min="0" value={valor} onChange={(e) => setValor(e.target.value)} required autoFocus /></Field>
        {error && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{error}</p>}
        <div className="flex justify-end gap-2 mt-4"><Button variant="secondary" type="button" onClick={onClose}>Cancelar</Button><Button type="submit" disabled={saving}>{saving ? 'Confirmando…' : 'Confirmar entrega'}</Button></div>
      </form>
    </Modal>
  );
}
function OrdemForm({ ordem, clientes, error, onClose, onSave }) {
  const [form, setForm] = useState({
    id: ordem.id, numero: ordem.numero || String(Date.now()).slice(-6), cliente_id: ordem.cliente_id || (clientes[0]?.id || ''),
    aparelho: ordem.aparelho || '', imei: ordem.imei || '', problema: ordem.problema || '', status: ordem.status || 'Recebido',
    valor_orcamento: ordem.valor_orcamento ?? '', valor_final: ordem.valor_final ?? '',
    data_entrada: ordem.data_entrada || todayISO(), data_previsao: ordem.data_previsao || '', tecnico: ordem.tecnico || '', observacoes: ordem.observacoes || '',
    fotos: ordem.fotos || [],
  });
  const [fotoBusy, setFotoBusy] = useState(false);
  const [fotoErr, setFotoErr] = useState('');
  const submit = (e) => { e.preventDefault(); if (!form.aparelho.trim() || !form.cliente_id) return; onSave(form); };
  const handleFotos = async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    setFotoBusy(true); setFotoErr('');
    try {
      const urls = [];
      for (const file of files) urls.push(await uploadFoto(file, 'ordens', 1000));
      setForm((f) => ({ ...f, fotos: [...f.fotos, ...urls] }));
    } catch (err) { setFotoErr(err.message); }
    setFotoBusy(false);
    e.target.value = '';
  };
  const removerFoto = (url) => setForm((f) => ({ ...f, fotos: f.fotos.filter((u) => u !== url) }));
  if (clientes.length === 0) {
    return <Modal title="Nova ordem de serviço" onClose={onClose}><p className="text-sm" style={{ color: COLORS.textSecondary }}>Cadastre um cliente antes de abrir uma ordem de serviço.</p><div className="flex justify-end mt-4"><Button variant="secondary" onClick={onClose}>Fechar</Button></div></Modal>;
  }
  return (
    <Modal title={ordem.id ? `Ordem #${form.numero}` : 'Nova ordem de serviço'} onClose={onClose} wide>
      <form onSubmit={submit}>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4">
          <Field label="Cliente" required><Select value={form.cliente_id} onChange={(e) => setForm({ ...form, cliente_id: e.target.value })} required>{clientes.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}</Select></Field>
          <Field label="Aparelho (marca e modelo)" required><Input value={form.aparelho} onChange={(e) => setForm({ ...form, aparelho: e.target.value })} placeholder="ex: Samsung Galaxy A54" required /></Field>
        </div>
        <Field label="IMEI / número de série"><Input value={form.imei} onChange={(e) => setForm({ ...form, imei: e.target.value })} placeholder="opcional" /></Field>
        <Field label="Problema relatado" required><TextArea rows={2} value={form.problema} onChange={(e) => setForm({ ...form, problema: e.target.value })} required /></Field>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-x-4">
          <Field label="Status"><Select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>{STATUS_ORDER.map((s) => <option key={s} value={s}>{s}</option>)}</Select></Field>
          <Field label="Data de entrada"><Input type="date" value={form.data_entrada} onChange={(e) => setForm({ ...form, data_entrada: e.target.value })} /></Field>
          <Field label="Previsão de entrega"><Input type="date" value={form.data_previsao} onChange={(e) => setForm({ ...form, data_previsao: e.target.value })} /></Field>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-x-4">
          <Field label="Orçamento (R$)"><Input type="number" step="0.01" min="0" value={form.valor_orcamento} onChange={(e) => setForm({ ...form, valor_orcamento: e.target.value })} /></Field>
          <Field label="Valor final (R$)"><Input type="number" step="0.01" min="0" value={form.valor_final} onChange={(e) => setForm({ ...form, valor_final: e.target.value })} /></Field>
          <Field label="Técnico responsável"><Input value={form.tecnico} onChange={(e) => setForm({ ...form, tecnico: e.target.value })} /></Field>
        </div>
        <Field label="Observações"><TextArea rows={2} value={form.observacoes} onChange={(e) => setForm({ ...form, observacoes: e.target.value })} /></Field>
        <Field label="Fotos do aparelho (entrada)">
          <input type="file" accept="image/*" multiple onChange={handleFotos} className="text-xs" style={{ color: COLORS.textSecondary }} />
          {fotoBusy && <p className="text-xs mt-1" style={{ color: COLORS.textMuted }}>Enviando…</p>}
          {fotoErr && <p className="text-xs mt-1" style={{ color: COLORS.danger }}>{fotoErr}</p>}
          {form.fotos.length > 0 && (
            <div className="flex flex-wrap gap-2 mt-2">
              {form.fotos.map((url) => (
                <div key={url} className="relative">
                  <a href={url} target="_blank" rel="noreferrer"><img src={url} alt="" style={{ height: 64, width: 64, objectFit: 'cover', borderRadius: 4, border: `1px solid ${COLORS.border}` }} /></a>
                  <button type="button" onClick={() => removerFoto(url)} className="absolute -top-1.5 -right-1.5 rounded-full flex items-center justify-center" style={{ width: 18, height: 18, backgroundColor: COLORS.danger, color: '#fff', fontSize: 11, lineHeight: 1 }}>✕</button>
                </div>
              ))}
            </div>
          )}
        </Field>
        {error && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{error}</p>}
        <div className="flex justify-end gap-2 mt-4"><Button variant="secondary" type="button" onClick={onClose}>Cancelar</Button><Button type="submit" disabled={fotoBusy}>Salvar</Button></div>
      </form>
    </Modal>
  );
}

// ---------- Estoque ----------
function EstoqueView({ table, onLancarFinanceiro }) {
  const [search, setSearch] = useState('');
  const [editing, setEditing] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const [vendendo, setVendendo] = useState(null);
  const [novaVenda, setNovaVenda] = useState(false);
  const [formErr, setFormErr] = useState('');
  const filtered = table.rows.filter((p) => p.nome.toLowerCase().includes(search.toLowerCase())).sort((a, b) => a.nome.localeCompare(b.nome));

  const save = async (data) => {
    try {
      const { id, ...rest } = data;
      rest.quantidade = toNum(rest.quantidade) ?? 0;
      rest.estoque_minimo = toNum(rest.estoque_minimo) ?? 0;
      rest.preco_custo = toNum(rest.preco_custo);
      rest.preco_venda = toNum(rest.preco_venda);
      if (id) await table.update(id, rest); else await table.insert(rest);
      setEditing(null); setFormErr('');
    } catch (e) { setFormErr(e.message); }
  };

  const confirmarVenda = async (peca, { quantidade, valorTotal, descricao }) => {
    await onLancarFinanceiro({ tipo: 'entrada', descricao, valor: toNum(valorTotal), categoria: 'Produto', data: todayISO() });
    const novaQtd = Math.max(0, Number(peca.quantidade || 0) - Number(quantidade || 0));
    await table.update(peca.id, { quantidade: novaQtd });
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h1 className="text-xl font-semibold" style={{ color: COLORS.textPrimary }}>Estoque de peças</h1>
        <div className="flex items-center gap-2">
          <Button variant="secondary" onClick={() => setNovaVenda(true)} disabled={table.rows.length === 0}><Icon name="wallet" size={16} /> Nova venda</Button>
          <Button onClick={() => setEditing({})}><Icon name="plus" size={16} /> Nova peça</Button>
        </div>

function VendaModal({ peca: pecaFixa, pecas, onClose, onConfirm }) {
  const [pecaId, setPecaId] = useState(pecaFixa?.id || pecas?.[0]?.id || '');
  const peca = pecaFixa || (pecas || []).find((p) => p.id === pecaId);
  const [quantidade, setQuantidade] = useState(1);
  const [valorUnit, setValorUnit] = useState(pecaFixa?.preco_venda || '');
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);
  const total = (Number(quantidade) || 0) * (Number(valorUnit) || 0);

  useEffect(() => {
    if (!pecaFixa) {
      const p = (pecas || []).find((x) => x.id === pecaId);
      setValorUnit(p?.preco_venda || '');
    }
  }, [pecaId]);

  const submit = async (e) => {
    e.preventDefault();
    if (!peca) return;
    setSaving(true); setError('');
    try {
      await onConfirm({ pecaEscolhida: peca, quantidade, valorTotal: total, descricao: `Venda: ${peca.nome} x${quantidade}` });
      onClose();
    } catch (err) { setError(err.message); setSaving(false); }
  };

  return (
    <Modal title={pecaFixa ? `Vender — ${pecaFixa.nome}` : 'Nova venda'} onClose={onClose}>
      <form onSubmit={submit}>
        {!pecaFixa && (
          <Field label="Produto" required>
            <Select value={pecaId} onChange={(e) => setPecaId(e.target.value)} required autoFocus>
              {(pecas || []).map((p) => <option key={p.id} value={p.id}>{p.nome} (estoque: {p.quantidade})</option>)}

          </Field>
        )}
        <p className="text-xs mb-3" style={{ color: COLORS.textMuted }}>Isso desconta do estoque e lança uma entrada no caixa (Financeiro). Em estoque: {peca?.quantidade ?? '—'}.</p>

        </div>

function resizeImageBlob(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          const ratio = Math.min(maxSize / width, maxSize / height);
          width = Math.round(width * ratio); height = Math.round(height * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('Não foi possível processar essa imagem.'))), 'image/jpeg', 0.82);
      };
      img.onerror = () => reject(new Error('Não foi possível ler essa imagem.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
    reader.readAsDataURL(file);
  });
}
async function uploadFoto(file, pasta, maxSize) {
  const blob = await resizeImageBlob(file, maxSize || 1000);
  const path = `${pasta}/${uid()}.jpg`;
  const { error } = await supabase.storage.from('fotos').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
  if (error) throw error;
  const { data } = supabase.storage.from('fotos').getPublicUrl(path);
  return data.publicUrl;
}

function resizeImageFile(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          const ratio = Math.min(maxSize / width, maxSize / height);
          width = Math.round(width * ratio); height = Math.round(height * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = () => reject(new Error('Não foi possível ler essa imagem.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
    reader.readAsDataURL(file);
  });
}
function RestaurarBackup() {
  const [parsed, setParsed] = useState(null);
  const [counts, setCounts] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');
  const ORDEM = ['clientes', 'estoque', 'ordens', 'financeiro', 'config'];

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setErr(''); setMsg(''); setParsed(null); setCounts(null);
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const c = {};
      ORDEM.forEach((t) => { c[t] = Array.isArray(data[t]) ? data[t].length : 0; });
      setParsed(data);
      setCounts(c);
    } catch (er) { setErr('Arquivo inválido: ' + er.message); }
    e.target.value = '';
  };

  const confirmar = async () => {
    setBusy(true); setErr('');
    try {
      for (const t of ORDEM) {
        const rows = parsed[t];
        if (!Array.isArray(rows) || rows.length === 0) continue;
        const { error } = await supabase.from(t).upsert(rows, { onConflict: 'id' });
        if (error) throw new Error(`"${t}": ${error.message}`);
      }
      setMsg('Backup restaurado com sucesso. Recarregue a página para ver os dados atualizados.');
      setParsed(null); setCounts(null);
    } catch (er) { setErr(er.message); }
    setBusy(false);
  };

  return (
    <div className="p-3 rounded mb-4" style={{ backgroundColor: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}` }}>
      <p className="text-sm font-medium mb-1" style={{ color: COLORS.textPrimary }}>Restaurar backup</p>
      <p className="text-xs mb-2" style={{ color: COLORS.textMuted }}>Adiciona ou atualiza os dados do arquivo .json — não apaga nada que já existe hoje.</p>
      {!parsed && <input type="file" accept="application/json" onChange={handleFile} className="text-xs" style={{ color: COLORS.textSecondary }} />}
      {counts && (
        <div className="mt-2">
          <p className="text-xs mb-2" style={{ color: COLORS.textPrimary }}>
            Encontrado no arquivo: {counts.clientes} clientes, {counts.ordens} ordens, {counts.estoque} peças, {counts.financeiro} lançamentos.
          </p>
          <div className="flex gap-2">
            <Button type="button" variant="secondary" onClick={() => { setParsed(null); setCounts(null); }} disabled={busy}>Cancelar</Button>
            <Button type="button" onClick={confirmar} disabled={busy}>{busy ? 'Restaurando…' : 'Confirmar restauração'}</Button>
          </div>
        </div>
      )}
      {msg && <p className="text-xs mt-2" style={{ color: COLORS.success }}>{msg}</p>}
      {err && <p className="text-xs mt-2" style={{ color: COLORS.danger }}>{err}</p>}
    </div>
  );
}
function ConfigModal({ config, onClose, onSave }) {
  const [form, setForm] = useState({ ...DEFAULT_CONFIG, ...config });
  const [error, setError] = useState('');
  const [logoBusy, setLogoBusy] = useState(false);
  const [backupBusy, setBackupBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    try { await onSave(form); onClose(); } catch (err) { setError(err.message); }
  };
  const handleLogo = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setLogoBusy(true); setError('');
    try { const dataUrl = await resizeImageFile(file, 300); setForm({ ...form, logo: dataUrl }); }
    catch (err) { setError(err.message); }
    setLogoBusy(false);
  };
  const baixarBackup = async () => {
    setBackupBusy(true); setError('');
    try {
      const tabelas = ['clientes', 'ordens', 'estoque', 'financeiro', 'config'];
      const resultado = { exportado_em: new Date().toISOString() };
      for (const t of tabelas) {
        const { data, error: err } = await supabase.from(t).select('*');
        if (err) throw err;
        resultado[t] = data;
      }
      const blob = new Blob([JSON.stringify(resultado, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `backup-loja-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch (err) { setError('Falha ao gerar backup: ' + err.message); }
    setBackupBusy(false);
  };
  return (
    <Modal title="Dados da loja" onClose={onClose}>
      <p className="text-xs mb-3" style={{ color: COLORS.textMuted }}>Essas informações aparecem no cabeçalho dos recibos emitidos.</p>
      <div className="flex items-center justify-between p-3 rounded mb-4" style={{ backgroundColor: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}` }}>
        <div><p className="text-sm font-medium" style={{ color: COLORS.textPrimary }}>Backup dos dados</p><p className="text-xs" style={{ color: COLORS.textMuted }}>Baixa clientes, ordens, estoque e financeiro num arquivo.</p></div>
        <Button type="button" variant="secondary" onClick={baixarBackup} disabled={backupBusy}>{backupBusy ? 'Gerando…' : 'Baixar backup'}</Button>
      </div>
      <RestaurarBackup />
      <form onSubmit={submit}>
        <Field label="Logo da loja">
          <div className="flex items-center gap-3">
            {form.logo && <img src={form.logo} alt="logo" style={{ height: 44, width: 44, objectFit: 'contain', border: `1px solid ${COLORS.border}`, borderRadius: 4 }} />}
            <input type="file" accept="image/*" onChange={handleLogo} className="text-xs" style={{ color: COLORS.textSecondary }} />
            {form.logo && <button type="button" onClick={() => setForm({ ...form, logo: '' })} className="text-xs" style={{ color: COLORS.danger }}>Remover</button>}
          </div>
          {logoBusy && <p className="text-xs mt-1" style={{ color: COLORS.textMuted }}>Processando imagem…</p>}
        </Field>
        <Field label="Nome da loja" required><Input value={form.nome_loja} onChange={(e) => setForm({ ...form, nome_loja: e.target.value })} required /></Field>
        <Field label="CNPJ"><Input value={form.cnpj} onChange={(e) => setForm({ ...form, cnpj: e.target.value })} placeholder="00.000.000/0000-00" /></Field>
        <Field label="Endereço"><Input value={form.endereco} onChange={(e) => setForm({ ...form, endereco: e.target.value })} /></Field>
        <Field label="Telefone"><Input value={form.telefone} onChange={(e) => setForm({ ...form, telefone: e.target.value })} /></Field>
        <div className="grid grid-cols-2 gap-x-4"><Field label="Garantia legal (dias)"><Input type="number" min="0" value={form.prazo_garantia_dias} onChange={(e) => setForm({ ...form, prazo_garantia_dias: e.target.value })} /></Field><Field label="Prazo de retirada (dias)"><Input type="number" min="0" value={form.prazo_retirada_dias} onChange={(e) => setForm({ ...form, prazo_retirada_dias: e.target.value })} /></Field></div>
        {error && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{error}</p>}
        <div className="flex justify-end gap-2 mt-4"><Button variant="secondary" type="button" onClick={onClose}>Cancelar</Button><Button type="submit" disabled={logoBusy}>Salvar</Button></div>
      </form>
    </Modal>
  );
}

// ---------- Equipe ----------
function EquipeView({ table, currentUserId }) {
  const [adding, setAdding] = useState(false);
  const rows = [...table.rows].sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));

  return (
    <div>
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h1 className="text-xl font-semibold" style={{ color: COLORS.textPrimary }}>Equipe</h1>
        <Button onClick={() => setAdding(true)}><Icon name="plus" size={16} /> Adicionar funcionário</Button>
      </div>
      <ErrorBanner message={table.err} />
      {rows.length === 0 ? <EmptyState icon="team" title="Nenhum usuário encontrado" /> : (
        <div className="rounded overflow-hidden" style={{ border: `1px solid ${COLORS.border}` }}>
          {rows.map((p) => (
            <EquipeRow key={p.id} p={p} isSelf={p.id === currentUserId} onSave={(data) => table.update(p.id, data)} />
          ))}
        </div>
      )}
      {adding && <AdicionarFuncionarioModal onClose={() => setAdding(false)} onCreated={() => table.reload()} />}
    </div>
  );
}
function EquipeRow({ p, isSelf, onSave }) {
  const [nome, setNome] = useState(p.nome || '');
  return (
    <div className="flex items-center justify-between px-4 py-3 gap-3 flex-wrap" style={{ backgroundColor: COLORS.surface, borderBottom: `1px solid ${COLORS.border}` }}>
      <Input value={nome} onChange={(e) => setNome(e.target.value)} onBlur={() => nome !== p.nome && onSave({ nome })} style={{ maxWidth: 260 }} />
      <div className="flex items-center gap-2">
        {isSelf && <span className="text-xs" style={{ color: COLORS.textMuted }}>(você)</span>}
        <Select value={p.role} disabled={isSelf} onChange={(e) => onSave({ role: e.target.value })} style={{ width: 'auto' }}>
          <option value="funcionario">Funcionário</option>
          <option value="dono">Dono</option>
        </Select>
      </div>
    </div>
  );
}
function AdicionarFuncionarioModal({ onClose, onCreated }) {
  const [nome, setNome] = useState('');
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [role, setRole] = useState('funcionario');
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setSaving(true); setError('');
    try {
      const { data, error: signErr } = await supabaseAuthOnly.auth.signUp({ email, password: senha });
      if (signErr) throw signErr;
      const newId = data.user?.id;
      if (newId) {
        await new Promise((r) => setTimeout(r, 900));
        const { error: upErr } = await supabase.from('profiles').upsert({ id: newId, nome: nome || email, role });
        if (upErr) throw upErr;
      }
      onCreated();
      onClose();
    } catch (err) { setError(err.message); }
    setSaving(false);
  };

  return (
    <Modal title="Adicionar funcionário" onClose={onClose}>
      <form onSubmit={submit}>
        <Field label="Nome" required><Input value={nome} onChange={(e) => setNome(e.target.value)} required autoFocus /></Field>
        <Field label="E-mail (login)" required><Input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required /></Field>
        <Field label="Senha" required><Input type="password" value={senha} onChange={(e) => setSenha(e.target.value)} minLength={6} required /></Field>
        <Field label="Papel"><Select value={role} onChange={(e) => setRole(e.target.value)}><option value="funcionario">Funcionário</option><option value="dono">Dono</option></Select></Field>
        {error && <p className="text-xs mb-2" style={{ color: COLORS.danger }}>{error}</p>}
        <div className="flex justify-end gap-2 mt-4"><Button variant="secondary" type="button" onClick={onClose}>Cancelar</Button><Button type="submit" disabled={saving}>{saving ? 'Criando…' : 'Criar acesso'}</Button></div>
      </form>
      <p className="text-xs mt-3" style={{ color: COLORS.textMuted }}>Dependendo da configuração do Supabase, essa pessoa pode precisar confirmar o e-mail antes de conseguir entrar. Para liberar o acesso na hora, desative "Confirm email" em Authentication &gt; Providers &gt; Email no painel do Supabase.</p>
    </Modal>
  );
}

// ---------- Main app (post-login) ----------
function MainApp({ profile, userEmail }) {
  const [tab, setTab] = useState('dashboard');
  const [mobileOpen, setMobileOpen] = useState(false);
  const [configOpen, setConfigOpen] = useState(false);
  const isDono = profile.role === 'dono';

  const clientesT = useTable('clientes', 'nome');
  const ordensT = useTable('ordens', 'data_entrada');
  const estoqueT = useTable('estoque', 'nome');
  const financeiroT = useTable('financeiro', 'data');
  const configT = useTable('config', 'id');
  const equipeT = useTable('profiles', 'nome');
  const config = configT.rows[0] || DEFAULT_CONFIG;

  useEffect(() => { if (!isDono && (tab === 'financeiro' || tab === 'equipe')) setTab('dashboard'); }, [isDono, tab]);

  const navItems = [
    { id: 'dashboard', label: 'Painel', icon: 'home' },
    { id: 'clientes', label: 'Clientes', icon: 'users' },
    { id: 'ordens', label: 'Ordens de serviço', icon: 'wrench' },
    { id: 'estoque', label: 'Estoque', icon: 'package' },
    ...(isDono ? [{ id: 'financeiro', label: 'Financeiro', icon: 'wallet' }] : []),
    ...(isDono ? [{ id: 'equipe', label: 'Equipe', icon: 'team' }] : []),
  ];

  const saveConfig = async (data) => {
    const { id, ...rest } = data;
    rest.prazo_garantia_dias = toNum(rest.prazo_garantia_dias) ?? 90;
    rest.prazo_retirada_dias = toNum(rest.prazo_retirada_dias) ?? 90;
    if (config.id) await configT.update(config.id, rest); else await configT.insert({ id: 1, ...rest });
  };

  return (
    <div className="min-h-screen flex" style={{ backgroundColor: COLORS.bg }}>
      <Sidebar items={navItems} active={tab} onNavigate={setTab} mobileOpen={mobileOpen} onCloseMobile={() => setMobileOpen(false)} isDono={isDono} onOpenConfig={() => setConfigOpen(true)} />
      <div className="flex-1 min-w-0 flex flex-col">
        <header className="flex items-center justify-between gap-3 px-4 py-3" style={{ backgroundColor: COLORS.surface, borderBottom: `1px solid ${COLORS.border}` }}>
          <div className="flex items-center gap-3">
            <button onClick={() => setMobileOpen(true)} className="p-1.5 md:hidden"><Icon name="menu" size={20} color={COLORS.textPrimary} /></button>
            <p className="font-semibold md:hidden" style={{ fontFamily: "'JetBrains Mono', monospace", color: COLORS.textPrimary }}>Bancada</p>
          </div>
          <div className="flex items-center gap-3">
            <span className="text-xs hidden sm:inline" style={{ color: COLORS.textMuted }}>{userEmail} · {isDono ? 'dono' : 'funcionário'}</span>
            <button onClick={() => supabase.auth.signOut()} className="text-xs px-2 py-1.5 rounded font-medium" style={{ color: COLORS.danger, border: `1px solid ${COLORS.border}` }}>Sair</button>
          </div>
        </header>
        <main className="flex-1 p-4 md:p-8 max-w-6xl w-full mx-auto">
          {tab === 'dashboard' && <Dashboard clientes={clientesT.rows} ordens={ordensT.rows} estoque={estoqueT.rows} financeiro={financeiroT.rows} isDono={isDono} onNavigate={setTab} />}
          {tab === 'clientes' && <ClientesView table={clientesT} />}
          {tab === 'ordens' && <OrdensView table={ordensT} clientesRows={clientesT.rows} config={config} onLancarFinanceiro={financeiroT.insert} />}
          {tab === 'estoque' && <EstoqueView table={estoqueT} onLancarFinanceiro={financeiroT.insert} />}
          {tab === 'financeiro' && isDono && <FinanceiroView table={financeiroT} />}
          {tab === 'equipe' && isDono && <EquipeView table={equipeT} currentUserId={profile.id} />}
        </main>
      </div>
      {configOpen && <ConfigModal config={config} onClose={() => setConfigOpen(false)} onSave={saveConfig} />}
    </div>
  );
}

// ---------- App root (auth gate) ----------
function App() {
  const [session, setSession] = useState(undefined);
  const [profile, setProfile] = useState(null);
  const [profileErr, setProfileErr] = useState('');

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = supabase.auth.onAuthStateChange((_e, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (session === undefined) return;
    if (!session) { setProfile(null); return; }
    (async () => {
      let { data, error } = await supabase.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
      if (!error && !data) {
        const ins = await supabase.from('profiles').insert({ id: session.user.id, nome: session.user.email, role: 'funcionario' }).select().maybeSingle();
        data = ins.data; error = ins.error;
      }
      if (error) setProfileErr(error.message); else setProfile(data);
    })();
  }, [session]);

  if (session === undefined) return <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: COLORS.bg }}><p className="text-sm" style={{ color: COLORS.textMuted }}>Carregando…</p></div>;
  if (!session) return <LoginScreen />;
  if (profileErr) return (
    <div className="min-h-screen flex flex-col items-center justify-center p-4 gap-3 text-center" style={{ backgroundColor: COLORS.bg }}>
      <p className="text-sm" style={{ color: COLORS.danger }}>Não foi possível carregar seu perfil: {profileErr}</p>
      <button onClick={() => supabase.auth.signOut()} className="text-sm px-3 py-1.5 rounded font-medium" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.textPrimary }}>Sair e tentar de novo</button>
    </div>
  );
  if (!profile) return <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: COLORS.bg }}><p className="text-sm" style={{ color: COLORS.textMuted }}>Carregando perfil…</p></div>;

  return <MainApp profile={profile} userEmail={session.user.email} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} catch (e) {
  document.getElementById('root').innerHTML = '<pre style="padding:20px;color:#B0402F;white-space:pre-wrap;font-family:monospace;font-size:12px;text-align:left;max-width:700px;margin:40px auto">Erro ao carregar o sistema:\n\n' + (e && e.message ? e.message : String(e)) + '</pre>';
  console.error(e);
}
</script>
</body>
